name: SHAutoTool
version: '${project.version}'
main: org.Cry_Legende.sHAutoTool.SHAutoTool
api-version: '1.20'
author: Cry_Legende
description: Change automatiquement d'outil pour le plus adapté dans la hotbar.

commands:
  shautotooltoggle:
    description: Active ou désactive l'AutoTool pour vous.
    usage: /shautotooltoggle
    aliases: [shatt, autotooltoggle]
  shautotool:
    description: Commande administrative pour SHAutoTool.
    usage: /shautotool <reload>
    aliases: [shat]
    permission: shautotool.admin

permissions:
  shautotool.admin:
    description: "Donne accès aux commandes d'administration de SHAutoTool."
    default: op
  shautotool.reload:
    description: "Permet de recharger la configuration de SHAutoTool."
    default: op
