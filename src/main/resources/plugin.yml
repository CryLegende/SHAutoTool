name: SHAutoTool
version: '${project.version}'
main: org.Cry_Legende.sHAutoTool.SHAutoTool
api-version: '1.20'
author: Cry_Legende
description: Change automatiquement d'outil pour le plus adapté dans la hotbar.
# SHNetwork est facultatif : sans lui, la liste des joueurs désactivés reste locale (disabled_players.txt) comme avant.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (liste en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  autotool:
    description: Active ou désactive l'AutoTool pour vous.
    usage: /autotool
    aliases: [shautotooltoggle, autotooltoggle, shatt]
  shautotool:
    description: Administration de SHAutoTool (reload, import).
    usage: /shautotool <reload|import>
    aliases: [shat]
    permission: shautotool.admin.reload;shautotool.admin.import

permissions:
  shautotool.admin:
    description: Toute l'administration de SHAutoTool.
    default: op
    children:
      shautotool.admin.reload: true
      shautotool.admin.import: true
  shautotool.admin.reload:
    description: Recharger config.yml et messages.yml (/shautotool reload).
    default: op
  shautotool.admin.import:
    description: Reprendre disabled_players.txt dans la base partagée, mode réseau (/shautotool import).
    default: op
