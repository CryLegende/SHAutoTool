# ======================================================================== #
# SHAutoTool
#
# Plugin : change automatiquement d'outil pour le plus adapté dans la hotbar quand le joueur clique sur un bloc
# ou frappe une entité. Chaque joueur peut le désactiver pour lui. Avec SHNetwork, ce choix suit le joueur d'un
# serveur à l'autre (voir la section 'reseau' en bas du fichier).
#
# Commandes :
#   /shautotooltoggle     Active ou désactive l'AutoTool pour soi (alias : /shatt, /autotooltoggle).
#   /shautotool reload    Recharge la configuration (alias : /shat). Les clés de 'reseau' demandent un redémarrage.
#   /shautotool import    Mode réseau : reprend disabled_players.txt dans la base partagée (une seule fois).
#
# Permissions :
#   shautotool.admin      Utiliser /shautotool (par défaut : op).
#   shautotool.reload     Recharger la configuration (par défaut : op).
#
# Placeholder : %shautotool_status% = texte de 'placeholders' selon l'état du joueur.
#
# Les messages du mode réseau sont dans 'messages.yml'.
#
# ======================================================================== #

# Configuration pour les restrictions de monde de SHAutoTool.

worlds:
  # Mode de fonctionnement de la liste des mondes.
  # 'blacklist': Le plugin sera désactivé dans les mondes listés ci-dessous.
  # 'whitelist': Le plugin ne sera activé QUE dans les mondes listés ci-dessous.
  mode: whitelist
  
  # Liste des noms de mondes concernés par le mode ci-dessus.
  # Les noms doivent correspondre exactement aux noms des dossiers de vos mondes.
  # Exemple :
  # list:
  #   - 'world_creative'
  #   - 'monde_minijeux'
  list:
  - SuperiorWorld

# Le changement d'outil automatique ne se déclenchera pas si vous cliquez
# sur l'un de ces blocs. Utile pour éviter de casser des blocs fragiles
# comme la farmland en changeant d'outil pour une pelle.
# Utilisez les noms de matériaux de Spigot (ex: FARMLAND, WHEAT, CARROTS).
block-blacklist:
- FARMLAND
- WHEAT
- POTATOES
- CARROTS
- BEETROOTS
- NETHER_WART
- COCOA
- SWEET_BERRY_BUSH
- MELON_STEM
- PUMPKIN_STEM
- SUGAR_CANE
- BAMBOO
- KELP_PLANT
- VINE
- TWISTING_VINES
- WEEPING_VINES
- SCULK_CATALYST

options:
  # Si 'true', l'auto-tool ne s'activera pas si le joueur a une hache en or
  # (GOLDEN_AXE) dans sa main principale. Très utile pour la compatibilité
  # avec la 'wand' de WorldEdit.
  disable-if-holding-golden-axe: true

# Configurez le texte affiché par le placeholder %shautotool_status%.
placeholders:
  status_enabled: enabled
  status_disabled: disabled

messages:
  toggle-enabled: '&7&l« &a&lSH &8&l» &fVous avez activé l''auto-tool'
  toggle-disabled: '&7&l« &c&lSH &8&l» &fVous avez désactivé l''auto-tool'

# Mode réseau. Actif seulement si SHNetwork est installé et 'actif' vaut true : la liste des joueurs qui ont
# désactivé l'AutoTool est alors dans la base partagée (table shautotool_disabled : une ligne par joueur) et relue
# à l'arrivée du joueur sur un serveur. Sans SHNetwork, rien de ceci n'est utilisé et la liste reste dans
# disabled_players.txt. Demande un redémarrage.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder
  # le joueur avant de relire son état
  attente-max-secondes: 10
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shautotool
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas
    # laisse le joueur avec l'AutoTool actif.
    delai-ms: 3000
